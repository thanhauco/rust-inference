[package]
name = "garlic-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small LLM inference engine in Rust (port of garlic-inference)"
license = "MIT"
readme = "README.md"
exclude = ["docs/videos/"]
authors = ["Thanh <thanhauco@gmail.com>"]

[lib]
name = "garlic"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/bin/runner.rs"

[features]
default = []
# CUDA backend; libcuda / libnvrtc / libcublas are loaded at runtime.
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
cudarc = { version = "0.19", optional = true, default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-12080"] }
libloading = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-general-category = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
