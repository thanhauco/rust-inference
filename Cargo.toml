[package]
name = "garlic-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small LLM inference engine in Rust (port of garlic-inference)"
license = "MIT"
readme = "README.md"
authors = ["Thanh <thanhauco@gmail.com>"]

[lib]
name = "garlic"
path = "src/lib.rs"

[dependencies]
half = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
